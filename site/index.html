<!doctype html>
<!-- Deployments site. Built by tools/build.sh, which fills #data. Starter: templates/starter.html. -->
<html lang="en" data-theme="dark" data-flavor="catalog" data-fx="cursor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Szmelc WebUI doctrine: one core, small per-project flavors, and a weekly audit of every public deployment.">
<title>Deployments · Szmelc WebUI doctrine</title>
<script>
(function(){
  var T = ['dark','light','mono','terminal'], t = null;
  try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
  if (T.indexOf(t) < 0) { t = null; try { t = localStorage.getItem('deployments-theme'); } catch (e) {} }
  if (T.indexOf(t) < 0) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* == szmelc core v1 ==========================================================
   One core for every Szmelc project web UI. Rules: DOCTRINE.md, RULES/.
   Token names follow CONVENTIONS META/tools/site.sh, so a page built from
   either source reads the same variables.
   Locked: palette, neutrals, lines, radius, type, focus, status marks.
   Flavor knobs (RULES/FLAVORS.md): data-flavor, data-fx, --rule, --wm-*, --font-body.
   Do not edit a copy of this block inside a page: edit templates/szmelc.css
   and run tools/sync-core.sh.
   ========================================================================== */
:root{
  /* palette: CONVENTIONS/DESIGN/COLORS.md, profile szmelc */
  --accent-d:#0a3d3d; --accent:#105c5c; --accent-m:#167272; --accent-t:#1f8a8a; --accent-l:#34a3a3;
  --danger-d:#4a0a0a; --danger:#750f0f; --danger-t:#b83a3a; --danger-l:#dc6464;
  --silver:#c0c0c0; --aqua:#7fffd4;
  /* surfaces: page > panel > band > hover > raised > pressed */
  --bg:#0b0b0b; --s1:#0f0f0f; --surface:#131313; --s3:#171717; --raise:#1b1b1b; --s5:#212121;
  /* lines: row divider > frame > control > hover; --ctl keeps 3:1 for input edges */
  --line-soft:#1c1c1c; --line:#262626; --line-2:#303030; --line-3:#3a3a3a; --ctl:#666666;
  /* text: headings > body > secondary > muted > faint (decoration only) */
  --head:#f2f2f2; --fg:#e3e3e3; --sec:#c0c0c0; --mute:#9a9a9a; --faint:#6e6e6e;
  /* roles */
  --link:var(--accent-l); --edge:var(--accent-t); --ring:var(--accent-l);
  --fill:var(--accent); --on-fill:#fff;
  --tint:color-mix(in srgb,var(--accent) 22%,var(--bg)); --tint-2:color-mix(in srgb,var(--accent) 40%,var(--bg));
  --ex:var(--danger); --ex-t:var(--danger-l); --ex-tint:color-mix(in srgb,var(--danger) 22%,var(--bg));
  --hl:var(--aqua); --on-hl:#0b0b0b;
  /* type: mono everywhere; reader and panel archetypes may switch --font-body to the system sans */
  --font:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --font-sans:system-ui,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-body:var(--font);
  /* shape: square, 1px lines, no blur shadows */
  --r:3px; --bw:1px;
  /* flavor knobs (RULES/FLAVORS.md) */
  --rule:var(--accent);           /* 3-4px top rule */
  --wm-prompt:"\276F";            /* wordmark prompt glyph: ❯ */
  --wm-mark:var(--accent-l);      /* wordmark suffix and cursor */
  --wm-size:clamp(1.4rem,6.4vw,3.3rem);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f3f3; --s1:#f8f8f8; --surface:#ffffff; --s3:#ececec; --raise:#e4e4e4; --s5:#dcdcdc;
  --line-soft:#e4e4e4; --line:#d6d6d6; --line-2:#cacaca; --line-3:#b4b4b4; --ctl:#8a8a8a;
  --head:#0b0b0b; --fg:#141414; --sec:#4a4a4a; --mute:#5c5c5c; --faint:#8a8a8a;
  --link:var(--accent); --edge:var(--accent); --ring:var(--accent); --ex-t:var(--danger);
  --hl:var(--accent); --on-hl:#fff; --wm-mark:var(--accent);
  --tint:color-mix(in srgb,var(--accent) 9%,#fff); --tint-2:color-mix(in srgb,var(--accent) 18%,#fff);
  --ex-tint:color-mix(in srgb,var(--danger) 8%,#fff);
  color-scheme:light;
}
:root[data-theme="mono"]{ /* greys and silver only: no accent hue */
  --link:var(--fg); --edge:var(--silver); --ring:var(--silver); --fill:var(--silver); --on-fill:#0b0b0b;
  --ex:var(--silver); --ex-t:var(--silver); --hl:var(--silver); --rule:var(--silver); --wm-mark:var(--silver);
  --tint:color-mix(in srgb,var(--silver) 10%,var(--bg)); --tint-2:color-mix(in srgb,var(--silver) 22%,var(--bg)); --ex-tint:var(--s3);
}
:root[data-theme="terminal"]{
  --s1:#0b0b0b; --surface:#0f0f0f; --s3:#131313; --raise:#171717;
  --fg:#c0c0c0; --head:var(--accent-l); --sec:#c0c0c0;
}
@media (prefers-contrast:more){
  :root:not([data-theme="light"]){--mute:#b4b4b4; --faint:#9a9a9a; --line-soft:#303030; --line:#3a3a3a; --line-2:#4a4a4a; --line-3:#5a5a5a; --ctl:#8a8a8a}
  :root[data-theme="light"]{--mute:#3a3a3a; --sec:#2e2e2e; --faint:#5c5c5c; --line:#b0b0b0; --line-2:#9a9a9a; --line-3:#808080; --ctl:#5c5c5c}
}

/* == flavor presets: archetype defaults, one line each (RULES/ARCHETYPES.md) == */
[data-flavor="catalog"]{--wm-prompt:"\276F"}
[data-flavor="registry"]{--wm-prompt:"$"}
[data-flavor="reader"]{--wm-prompt:"\00A7"; --font-body:var(--font-sans)}
[data-flavor="docs"]{--wm-prompt:"#"; --font-body:var(--font-sans)}
[data-flavor="panel"]{--wm-prompt:"\25A0"; --font-body:var(--font-sans); --r:0}
[data-flavor="landing"]{--wm-prompt:"\276F"; --wm-size:clamp(2rem,9vw,4.6rem)}

/* == base == */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[id]{scroll-margin-top:64px}                                      /* deep links land below the sticky bar */
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 var(--font-body);border-top:3px solid var(--rule);overflow-x:hidden}
h1,h2,h3,h4{color:var(--head);line-height:1.25;margin:1.2em 0 .5em}
h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.9rem}
p,li{max-width:92ch}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
code,kbd,pre,.mono,table,label,.st,.badge,.tabs,.statusbar,.wm{font-family:var(--font)}
code{font-size:.92em;background:var(--raise);border:var(--bw) solid var(--line);border-radius:var(--r);padding:0 .35em;overflow-wrap:anywhere}
kbd{font-size:.85em;border:var(--bw) solid var(--line-3);border-bottom-width:2px;border-radius:var(--r);padding:0 .4em;background:var(--surface)}
pre{background:var(--s1);border:var(--bw) solid var(--line);border-left:3px solid var(--edge);border-radius:var(--r);padding:10px 12px;overflow:auto;max-width:100%}
pre code{background:none;border:0;padding:0}
hr{border:0;border-top:var(--bw) solid var(--line);margin:16px 0}
mark{background:var(--tint-2);color:inherit;outline:var(--bw) solid var(--edge)}
::selection{background:var(--tint-2)}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:8px;z-index:20;background:var(--fill);color:var(--on-fill);padding:4px 8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.mute{color:var(--mute)} .faint{color:var(--faint)} .small{font-size:12.5px}

/* == wordmark: the brand mark; one per page == */
.wm{display:block;text-align:center;font-size:var(--wm-size);font-weight:800;color:var(--head);letter-spacing:-.02em;white-space:nowrap;margin:.5em 0 .3em;line-height:1.1}
.wm::before{content:var(--wm-prompt) " ";color:var(--faint);font-weight:400}
.wm b{color:var(--wm-mark);font-weight:inherit}
.wm .cur{display:inline-block;width:.55em;height:.9em;background:var(--wm-mark);vertical-align:-.08em;margin-left:.08em}
@media (max-width:600px){.wm{margin-top:48px}}                    /* clear the fixed [MENU] button */

/* == controls == */
.btn,button.btn,a.btn{font:inherit;font-family:var(--font);font-size:13px;color:var(--fg);background:var(--surface);border:var(--bw) solid var(--line-3);border-radius:var(--r);min-height:28px;padding:3px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--raise);border-color:var(--ctl)}
.btn:active{background:var(--s5)}
.btn.primary{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}           /* one per view */
.btn.primary:hover{background:var(--accent-m);border-color:var(--accent-m)}
.btn.danger{background:none;color:var(--ex-t);border-color:var(--ex)}                       /* outline, never a filled red */
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;font-family:var(--font);color:var(--fg);background:var(--s1);border:var(--bw) solid var(--ctl);border-radius:var(--r);min-height:28px;padding:3px 8px;max-width:100%}
input::placeholder{color:var(--faint)}

/* == frame: sticky bar, tabs, panels == */
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:8px 0;border-bottom:var(--bw) solid var(--line)}
.bar .grow{flex:1 1 220px}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:var(--bw) solid var(--edge);width:100%}
.tabs [role=tab]{font:inherit;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);background:var(--surface);border:var(--bw) solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:6px 14px;margin-right:4px;cursor:pointer}
.tabs [role=tab]:hover{color:var(--fg);background:var(--raise)}
.tabs [role=tab][aria-selected=true]{color:var(--on-fill);background:var(--fill);border-color:var(--fill)}
.tabs [role=tab] .n{opacity:.7;margin-left:6px;font-size:11.5px}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);margin:12px 0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:var(--bw) solid var(--line);font-family:var(--font);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sec)}
.panel>.body{padding:10px 12px}
.well{background:var(--s1);border:var(--bw) solid var(--line);border-left:3px solid var(--edge);padding:10px 14px;margin:8px 0}
.split{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:16px;align-items:start}
.split>*{min-width:0}                                             /* wide tables and code scroll in their own box */
.split>nav{position:sticky;top:56px;max-height:calc(100vh - 72px);overflow:auto}
@media (max-width:760px){.split{grid-template-columns:1fr}.split>nav{position:static;max-height:none}}

/* == data == */
.table-wrap{overflow-x:auto;max-width:100%;border:var(--bw) solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;background:var(--surface)}
th,td{padding:7px 10px;border-bottom:var(--bw) solid var(--line-soft);vertical-align:top}
tr:hover td{background:var(--s3)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;line-height:1.5;color:var(--sec);border:var(--bw) solid var(--line-3);border-radius:var(--r);padding:0 6px;white-space:nowrap}
.badge.ex{color:var(--ex-t);border-color:var(--ex)}
.badge.hl{background:var(--hl);color:var(--on-hl);border-color:var(--hl)}                    /* max 1-2 per screen */

/* == status marks: shape + lightness + a word, never hue alone (RULES/STATUS.md) == */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sec);white-space:nowrap}
.st::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute);box-sizing:border-box}
.st.needs{color:var(--head);font-weight:700} .st.needs::before{background:var(--link);border-color:var(--link)}   /* solid accent dot */
.st.working::before{background:var(--fg);border-color:var(--fg);animation:st-pulse 1.2s infinite}            /* solid light dot */
/* .st.idle: the default hollow ring */
.st.done::before{width:9px;height:2px;border:0;border-radius:0;background:var(--mute)}                       /* short dash */
.st.failed{color:var(--ex-t)}        .st.failed::before{content:"\2715";width:auto;height:auto;border:0;border-radius:0;font-size:10px;line-height:1}
.st.risk::before{border-radius:0;border-color:var(--ex-t)}                                                    /* square danger outline */
@keyframes st-pulse{50%{opacity:.35}}

/* == overlays == */
dialog{background:var(--surface);color:var(--fg);border:var(--bw) solid var(--line-3);border-radius:var(--r);max-width:min(92ch,calc(100vw - 32px));max-height:82vh;overflow:auto;padding:16px}
dialog::backdrop{background:radial-gradient(transparent 30%,rgba(0,0,0,.75))}
.menu{position:fixed;top:10px;right:10px;z-index:15}
.menu ul{list-style:none;margin:4px 0 0;padding:4px;background:var(--surface);border:var(--bw) solid var(--line-3);min-width:160px}
.menu li button{font:inherit;font-family:var(--font);font-size:13px;color:inherit;background:none;border:0;padding:5px 8px;width:100%;text-align:left;cursor:pointer}
.menu li button:hover,.menu li button:focus-visible{background:var(--fill);color:var(--on-fill)}
.statusbar{position:sticky;bottom:0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute);background:var(--s1);border-top:var(--bw) solid var(--line);padding:4px 16px}
.statusbar .push{margin-left:auto}
footer.byline{text-align:center;color:var(--faint);font-size:12px;padding:24px 16px}

/* == signature effects: pick at most one per page via data-fx on <html> (RULES/FLAVORS.md) == */
[data-fx="cursor"] .wm .cur{animation:fx-blink 1.1s steps(1) infinite}
[data-fx="scanlines"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px)}
[data-fx="glitch"] .wm b{text-shadow:2px 0 0 var(--accent-d),-2px 0 0 var(--danger-d);animation:fx-glitch 9s steps(1) infinite}
[data-fx="dither"] body{background-image:radial-gradient(var(--line-soft) 1px,transparent 1px);background-size:3px 3px}
@keyframes fx-blink{50%{opacity:0}}
@keyframes fx-glitch{0%,96%,100%{transform:none}97%{transform:translateX(2px)}98%{transform:translateX(-2px)}}

/* == accessibility floor == */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (prefers-contrast:more){[data-fx] body::after{display:none}}
@media (forced-colors:active){.tabs [role=tab][aria-selected=true],.btn.primary{forced-color-adjust:none;background:Highlight;color:HighlightText}.st::before{forced-color-adjust:none;border-color:CanvasText}}
@media print{body{border:0;background:#fff;color:#000}.bar,.menu,.statusbar{display:none}}
/* == end szmelc core v1 == */
</style>
<style>
/* flavor knobs */
:root{--rule:var(--accent)}
/* page parts built only from core tokens */
.md table{display:block;overflow-x:auto;max-width:100%}
.md h1{font-size:1.3rem}.md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line-3);color:var(--sec)}
.md .fm{display:none}
.doc{margin-bottom:28px}
.idx a{display:block;padding:3px 8px;color:var(--sec);text-decoration:none;border-left:2px solid transparent;font-family:var(--font);font-size:12.5px}
.idx a:hover{color:var(--fg);background:var(--s3)}.idx a[aria-current=true]{color:var(--head);border-left-color:var(--edge);background:var(--tint)}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0}
.flags .badge{margin:0 4px 4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.knob{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.knob .btn[aria-pressed=true]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
td a{word-break:break-all}
</style>
</head>

<nav class="menu" aria-label="Menu">

<main class="wrap">
  <h1 class="wm">Deployments<b>.2</b><span class="cur" aria-hidden="true"></span></h1>
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Views"></div>

</main>
<footer class="byline" id="byline"></footer>
<dialog id="modal" aria-labelledby="modal-t"><h2 id="modal-t"></h2><div id="modal-b"></div><p><button type="button" class="btn" id="modal-x">Close</button></p></dialog>
<script type="application/json" id="data">{"docs":[],"audit":{"generated":"","sites":[]},"templates":[],"repo":"","built":""}</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = JSON.parse($('#data').textContent);
const root = document.documentElement, q = $('#q'), modal = $('#modal'), menuBtn = $('#menu-btn'), menuP = $('#menu-p');
const VIEWS = [
  {id:'doctrine', title:'Doctrine', n:() => D.docs.length},
  {id:'deployments', title:'Deployments', n:() => D.audit.sites.length},
  {id:'flavors', title:'Flavors', n:() => 6},
  {id:'templates', title:'Templates', n:() => D.templates.length},
];
let view = 'doctrine', focusId = '';

// == markdown: small local renderer; input is escaped first ==
function md(src){
  src = src.replace(/^---\n[\s\S]*?\n---\n/, '');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
      const ok = /^(https?:|#|\.{0,2}\/?[\w-])/.test(u) && !/^javascript:/i.test(u);
      if (!ok) return t;
      const ext = /^https?:/.test(u);
      if (!ext) u = (D.repo ? D.repo + '/blob/main/' : '') + u.replace(/^\.\//, '');
      return `<a href="${u}"${ext || D.repo ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`;
    });
  const L = src.split('\n'), out = []; let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^```/.test(l)){ const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>' + esc(b.join('\n')) + '</code></pre>'); continue; }
    let m;
    if ((m = l.match(/^(#{1,4}) (.*)/))){ const n = m[1].length + 1; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\|/.test(l)){
      const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s:|-]+\|$/.test(r)));
      out.push('<div class="table-wrap"><table><thead><tr>' + cells(body[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        body.slice(1).map(r => '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*([-*]|\d+\.) /.test(l)){
      const ord = /^\s*\d+\./.test(l), it = [];
      while (i < L.length && /^\s*([-*]|\d+\.) /.test(L[i])) it.push(L[i++].replace(/^\s*([-*]|\d+\.) /, ''));
      out.push((ord ? '<ol>' : '<ul>') + it.map(x => '<li>' + inline(x) + '</li>').join('') + (ord ? '</ol>' : '</ul>')); continue;
    }
    if (/^> /.test(l)){ const b = []; while (i < L.length && /^> ?/.test(L[i])) b.push(L[i++].replace(/^> ?/, '')); out.push('<blockquote>' + inline(b.join(' ')) + '</blockquote>'); continue; }
    if (!l.trim()){ i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#|\||```|> |\s*([-*]|\d+\.) )/.test(L[i])) p.push(L[i++]);
    out.push('<p>' + inline(p.join(' ')) + '</p>');
  }
  return out.join('\n');
}

// == views ==
const f = () => q.value.trim().toLowerCase();
const has = (...s) => !f() || s.join(' ').toLowerCase().includes(f());
function vDoctrine(){
  const docs = D.docs.filter(d => has(d.path, d.md));
  const idx = docs.map(d => `<a href="#${esc(d.id)}">${esc(d.path)}</a>`).join('');
  const body = docs.map(d => `<section class="doc md" id="${esc(d.id)}"><p class="faint small mono">${esc(d.path)}</p>${md(d.md)}</section>`).join('');
  return [docs.length, `<div class="split"><nav class="idx" aria-label="Documents">${idx}</nav><div>${body || '<p class="mute">No matches. Esc clears the filter.</p>'}</div></div>`];
}
function mark(s){
  if (s.http === 200) return s.surface === 'skin' || s.surface === 'external' ? '<span class="st done">live</span>' : (s.flags.length ? '<span class="st risk">drift</span>' : '<span class="st done">live</span>');
  if (s.http === 0) return '<span class="st failed">down</span>';
  return `<span class="st failed">${esc(s.http)}</span>`;
}
function vDeployments(){
  const S = D.audit.sites.filter(s => has(s.url, s.repo, s.surface, s.archetype, s.notes, s.flags.join(' ')));
  const all = D.audit.sites, down = all.filter(s => s.http !== 200).length;
  const drift = all.filter(s => s.http === 200 && s.flags.length && /project|panel|legacy/.test(s.surface)).length;
  const rows = S.map(s => `<tr id="site-${esc((s.repo || s.name).replace(/[^\w.-]+/g, '-'))}">
    <td>${mark(s)}</td>
    <td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//, ''))}</a><div class="faint small">${esc(s.repo)}</div></td>
    <td>${esc(s.surface || '?')}<div class="faint small">${esc(s.archetype && s.archetype !== '-' ? s.archetype : '')}</div></td>
    <td class="flags">${s.flags.map(x => `<span class="badge${/skin|external/.test(s.surface) ? '' : ' ex'}">${esc(x)}</span>`).join('') || '<span class="faint">none</span>'}</td>
    <td class="small">${esc(s.notes)}</td></tr>`).join('');
  return [S.length, `<div class="stats"><span class="st needs">needs you: ${down + drift}</span><span class="st failed">not live: ${down}</span><span class="st risk">drift: ${drift}</span><span class="st done">sites: ${all.length}</span><span class="faint small">audit ${esc(D.audit.generated)} · public repositories only · skins are exempt from the visual core</span></div>
    <div class="table-wrap"><table><thead><tr><th>State</th><th>Site</th><th>Surface</th><th>Lint</th><th>Migration</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="mute">No matches.</td></tr>'}</tbody></table></div>
    <p class="faint small">Lint flags: <code>webfont</code> fetched fonts · <code>framework</code> CSS framework CDN · <code>tracker</code> analytics · <code>round</code> radius above 4px or pills · <code>no-theme</code> no dark/light handling · <code>purple</code> a saturated purple in the palette.</p>`];
}
const FL = {flavor:['catalog','registry','reader','docs','panel','landing'], fx:['none','cursor','scanlines','glitch','dither'], theme:['dark','light','mono','terminal']};
function vFlavors(){
  const knob = (k, cur) => `<div class="knob" role="group" aria-label="${k}">${FL[k].map(v => `<button type="button" class="btn" data-k="${k}" data-val="${v}" aria-pressed="${v === cur}">${v}</button>`).join('')}</div>`;
  return [6, `<p>These buttons switch this page's own knobs live. The page keeps reading as Szmelc. That is the flavor test (<a href="#doc-rules-flavors-md">RULES/FLAVORS.md</a>).</p>
    <h3>Archetype <span class="faint small">data-flavor</span></h3>${knob('flavor', root.dataset.flavor)}
    <h3>Signature effect <span class="faint small">data-fx</span></h3>${knob('fx', root.dataset.fx || 'none')}
    <h3>Theme <span class="faint small">data-theme</span></h3>${knob('theme', root.dataset.theme)}
    <div class="cards">
      <section class="panel"><header>Status marks <span class="badge hl">1</span></header><div class="body">
        <p><span class="st needs">needs you</span><br><span class="st working">running</span><br><span class="st">queued</span><br><span class="st done">done</span><br><span class="st failed">failed</span><br><span class="st risk">full access</span></p></div></section>
      <section class="panel"><header>Controls</header><div class="body">
        <p><button type="button" class="btn primary">Main action</button> <button type="button" class="btn">Plain</button></p>
        <p><button type="button" class="btn danger">Reject</button> <span class="badge">stable</span> <span class="badge ex">experimental</span></p>
        <p><input type="text" aria-label="Sample field" placeholder="field"> <kbd>/</kbd></p></div></section>
      <section class="panel"><header>Reading well</header><div class="body"><div class="well">One idea per line. Links <a href="#flavors">look like this</a>, code like <code>--rule</code>.</div>
        <pre><code>curl -fsSL https://example/add | sh</code></pre></div></section>
    </div>`];
}
function vTemplates(){
  const T = D.templates.filter(t => has(t.path, t.desc));
  return [T.length, `<div class="cards">${T.map(t => `<section class="panel" id="tpl-${esc(t.path.replace(/\W+/g, '-'))}"><header><span>${esc(t.path)}</span><span class="faint">${esc(t.size)}</span></header><div class="body"><p>${esc(t.desc)}</p>
    <p><a class="btn" href="${esc(t.path)}" download>Download</a> <button type="button" class="btn ghost" data-copy="curl -fsSLO ${esc(location.href.split('#')[0].replace(/index\.html$/, '') + t.path)}">Copy curl</button></p></div></section>`).join('')}</div>`];
}
const R = {doctrine:vDoctrine, deployments:vDeployments, flavors:vFlavors, templates:vTemplates};

function render(){
  $('#tabs').innerHTML = VIEWS.map((v, i) => `<button type="button" role="tab" data-v="${v.id}" aria-selected="${v.id === view}">${i + 1} ${v.title}<span class="n">${v.n()}</span></button>`).join('');
  const [n, html] = R[view]();
  $('#main').innerHTML = html;
  $('#status').textContent = f() ? `matches: ${n}` : '';
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.scrollIntoView({block:'start'}); document.querySelectorAll('.idx a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + focusId))); } focusId = ''; }
}

// == modal, routing, theme, menu, keys: CONVENTIONS WEBUI patterns ==
let opener = null;
function openModal(title, html, from){ opener = from || document.activeElement; $('#modal-t').textContent = title; $('#modal-b').innerHTML = html; if (!modal.open) modal.showModal(); }
modal.addEventListener('close', () => { if (location.hash === '#keys') history.replaceState(null, '', location.pathname + location.search); if (opener) opener.focus(); });
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
$('#modal-x').onclick = () => modal.close();
const KEYS = [['/', 'Focus the filter'], ['1–4', 'Switch views'], ['t', 'Theme'], ['?', 'This help'], ['Esc', 'Close the top layer, then clear the filter']];
const openKeys = from => { history.replaceState(null, '', '#keys'); openModal('Keys', '<ul>' + KEYS.map(k => `<li><kbd>${esc(k[0])}</kbd> ${esc(k[1])}</li>`).join('') + '</ul>', from); };
function route(){
  let id = ''; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (id === 'keys'){ render(); return openKeys(); }
  if (modal.open) modal.close();
  if (R[id]){ view = id; }
  else if (/^doc-/.test(id)){ view = 'doctrine'; focusId = id; q.value = ''; }
  else if (/^site-/.test(id)){ view = 'deployments'; focusId = id; q.value = ''; }
  else if (/^tpl-/.test(id)){ view = 'templates'; focusId = id; q.value = ''; }
  else view = 'doctrine';
  render();
}
addEventListener('hashchange', route);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) location.hash = b.dataset.v; });
$('#tabs').addEventListener('keydown', e => {
  const b = [...$('#tabs').children], i = b.indexOf(document.activeElement); if (i < 0) return;
  const k = {ArrowRight:i + 1, ArrowLeft:i - 1, Home:0, End:b.length - 1}[e.key]; if (k === undefined) return;
  e.preventDefault(); const n = (k + b.length) % b.length; location.hash = VIEWS[n].id; requestAnimationFrame(() => $('#tabs').children[n].focus());
});
q.addEventListener('input', render);
$('#main').addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (k){ const a = k.dataset.k, v = k.dataset.val;
    if (a === 'theme'){ root.dataset.theme = v; try { localStorage.setItem('deployments-theme', v); } catch (x) {} }
    else if (a === 'fx'){ if (v === 'none') delete root.dataset.fx; else root.dataset.fx = v; }
    else root.dataset[a] = v;
    render(); const again = $(`[data-k="${a}"][data-val="${v}"]`); if (again) again.focus(); return; }
  const c = e.target.closest('[data-copy]');
  if (c){ const old = c.textContent; navigator.clipboard?.writeText(c.dataset.copy).then(() => { c.textContent = 'Copied ✓'; setTimeout(() => c.textContent = old, 1000); }, () => {}); }
});
const THEMES = ['dark', 'light', 'mono', 'terminal'];
function cycleTheme(){ const t = THEMES[(THEMES.indexOf(root.dataset.theme) + 1) % THEMES.length]; root.dataset.theme = t; try { localStorage.setItem('deployments-theme', t); } catch (e) {} if (view === 'flavors') render(); }
function setMenu(open){ menuP.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); if (open) menuP.querySelector('button').focus(); }
menuBtn.onclick = () => setMenu(menuP.hidden);
document.addEventListener('click', e => { if (!menuP.hidden && !e.target.closest('.menu') && !modal.contains(e.target)) setMenu(false); });
menuP.addEventListener('focusout', e => { if (!menuP.contains(e.relatedTarget) && e.relatedTarget !== menuBtn && !modal.contains(e.relatedTarget)) setMenu(false); });
menuP.addEventListener('keydown', e => {
  const b = [...menuP.querySelectorAll('button')], i = b.indexOf(document.activeElement);
  const k = {ArrowDown:i + 1, ArrowUp:i - 1, Home:0, End:b.length - 1}[e.key];
  if (k !== undefined){ e.preventDefault(); b[(k + b.length) % b.length].focus(); }
});
$('#m-theme').onclick = cycleTheme;
$('#m-keys').onclick = e => { setMenu(false); openKeys(e.currentTarget); };
$('#m-src').onclick = () => { if (D.repo) window.open(D.repo, '_blank', 'noopener'); };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || modal.open) return;
  if (!menuP.hidden){ if (e.key === 'Escape'){ setMenu(false); menuBtn.focus(); } return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape'){ if (q.value){ q.value = ''; render(); } q.blur(); return; }
  if (typing) return;
  if (e.key === '/'){ e.preventDefault(); q.focus(); }
  else if (/^[1-4]$/.test(e.key)) location.hash = VIEWS[+e.key - 1].id;
  else if (e.key === 't') cycleTheme();
  else if (e.key === '?'){ e.preventDefault(); openKeys(); }
});
$('#skip').onclick = e => { e.preventDefault(); $('#main').focus(); };
$('#byline').innerHTML = `Szmelc-INC/Deployments · built ${esc(D.built)} · <a href="${esc(D.repo)}" target="_blank" rel="noopener">source</a> · MIT`;
route();
</script>
</body>
</html>
