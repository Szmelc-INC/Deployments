name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'templates/**', 'RULES/**', 'DOCTRINE.md', 'AUDIT.md', 'audit/**', 'tools/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 4 * * 1'   # weekly: the audit reads live sites outside this repo
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Audit live deployments (public repositories only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/audit.sh --quiet || echo "::warning::audit failed, using the committed snapshot"
      - name: Build
        run: tools/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
